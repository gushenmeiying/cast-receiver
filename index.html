<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>SmartMirroring Receiver</title>
<style>
  body { background: #000; margin: 0; display: flex; align-items: center; justify-content: center; height: 100vh; }
  p { color: #666; font-family: sans-serif; font-size: 24px; }
</style>
</head>
<body>
<p id="status">Connecting...</p>
<!--
  This is the Cast Custom Receiver redirect page.
  Deployed to GitHub Pages (HTTPS). After receiving the sender IP via
  Cast custom namespace message, it redirects to the sender's local
  HTTP receiver page where WebRTC signaling happens over ws://.
-->
<script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
<script>
(function() {
  'use strict';

  var NAMESPACE = 'urn:x-cast:com.smartmirroring.webrtc';
  var context = cast.framework.CastReceiverContext.getInstance();
  var timeout = null;

  // Listen for custom messages from sender
  context.addCustomMessageListener(NAMESPACE, function(event) {
    console.log('Got message from sender:', event.data);
    var data = event.data;
    if (data && data.senderIP) {
      var port = data.httpPort || 9099;
      var url = 'http://' + data.senderIP + ':' + port + '/chromecast.html';
      console.log('Redirecting to: ' + url);
      document.getElementById('status').textContent = 'Redirecting...';
      // Small delay to ensure Cast session is stable
      setTimeout(function() {
        location.replace(url);
      }, 300);
    }
  });

  // Start the Cast receiver context
  var options = new cast.framework.CastReceiverOptions();
  options.disableIdleTimeout = true;
  context.start(options);

  // Timeout: if no message received in 30s, show error
  timeout = setTimeout(function() {
    document.getElementById('status').textContent = 'No sender found. Please retry.';
  }, 30000);
})();
</script>
</body>
</html>
